<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estado de Cuenta</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #f4f6f8;
  --surface: #ffffff;
  --surface2: #fafafa;
  --border: #e3e8ee;
  --accent: #3b556e;
  --accent-green: #2e7d5b;
  --danger: #c44545;
  --text: #2b2f33;
  --muted: #6b7280;
  --shadow: 0 6px 18px rgba(0,0,0,0.06);
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg);
  font-family: 'Sora', sans-serif;
  color: var(--text);
  padding: 24px 16px 48px;
}

.container {
  max-width: 760px;
  margin: auto;
}

/* HEADER */
.header {
  display:flex;
  justify-content:space-between;
  padding:28px 32px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:16px 16px 0 0;
  box-shadow:var(--shadow);
}

.brand { font-size:11px; text-transform:uppercase; letter-spacing:2px; color:var(--muted); }
.brand-name { font-size:16px; font-weight:700; margin:6px 0; color:var(--accent); }
.folio-title { font-family:'DM Mono'; font-size:26px; }
.cliente-name { font-size:13px; color:var(--muted); margin-top:6px; }

.header-right { text-align:right; }
.fecha-label { font-size:11px; color:var(--muted); }
.fecha-val { font-family:'DM Mono'; font-size:14px; }

.ruta-badge {
  margin-top:10px;
  display:inline-block;
  padding:4px 10px;
  background:#eef3f8;
  border:1px solid #d7e2ed;
  border-radius:20px;
  font-size:11px;
  color:var(--accent);
}

/* SUMMARY */
.summary-grid {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  border-left:1px solid var(--border);
  border-right:1px solid var(--border);
}

.summary-card {
  background:var(--surface);
  padding:20px;
  text-align:center;
  border-top:1px solid var(--border);
}

.summary-label {
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:2px;
  color:var(--muted);
  margin-bottom:8px;
}

.summary-value {
  font-family:'DM Mono';
  font-size:20px;
}

.summary-value.venta { color:var(--accent); }
.summary-value.abonado { color:var(--accent-green); }
.summary-value.saldo { color:var(--danger); }

/* TABLE */
.section-header {
  padding:18px 24px;
  background:var(--surface);
  border-left:1px solid var(--border);
  border-right:1px solid var(--border);
  border-top:1px solid var(--border);
  font-size:12px;
  color:var(--muted);
  display:flex;
  justify-content:space-between;
}

.table-wrap {
  border:1px solid var(--border);
  border-top:none;
}

table {
  width:100%;
  border-collapse:collapse;
  font-size:13px;
}

thead th {
  background:var(--surface2);
  padding:12px;
  font-size:11px;
  color:var(--muted);
  text-align:left;
  border-bottom:1px solid var(--border);
}

tbody td {
  padding:12px;
  border-bottom:1px solid #eef2f6;
  font-family:'DM Mono';
}

tbody tr:hover { background:#f5f7fa; }

.td-adeudo, .td-abono, .td-saldo { text-align:right; }

.tipo-badge {
  padding:3px 10px;
  border-radius:12px;
  font-size:10px;
  font-weight:600;
  text-transform:uppercase;
}

.tipo-cobranza {
  background:#e6f4ef;
  color:var(--accent-green);
  border:1px solid #cde7dc;
}

.saldo-pill {
  background:#fdeeee;
  border:1px solid #f6d1d1;
  color:var(--danger);
  padding:3px 10px;
  border-radius:20px;
}

/* FOOTER */
.footer {
  background:var(--surface);
  border:1px solid var(--border);
  border-top:none;
  border-radius:0 0 16px 16px;
  padding:20px 28px;
  display:flex;
  justify-content:space-between;
  box-shadow:var(--shadow);
}

.saldo-final-val {
  font-family:'DM Mono';
  font-size:22px;
  color:var(--danger);
}
</style>
</head>

<body>
<div class="container" id="app"></div>

<script>

/* ========= PARSER ROBUSTO UNIVERSAL ========= */
function parseNum(raw) {
  if (raw == null) return 0;
  let s = String(raw).trim();
  s = s.replace(/[^\d.,-]/g, '');

  const lastDot = s.lastIndexOf('.');
  const lastComma = s.lastIndexOf(',');

  if (lastDot > -1 && lastComma > -1) {
    if (lastComma > lastDot) {
      s = s.replace(/\./g, '').replace(/,/g, '.');
    } else {
      s = s.replace(/,/g, '');
    }
  } else if (lastComma > -1) {
    s = s.replace(/\./g, '').replace(/,/g, '.');
  } else {
    s = s.replace(/,/g, '');
  }

  const n = Number(s);
  return Number.isFinite(n) ? n : 0;
}

function fmt(val) {
  const n = parseNum(val);
  return n.toLocaleString('es-MX', {
    style:'currency',
    currency:'MXN',
    minimumFractionDigits:2
  });
}

/* ========= URL PARAMS ========= */
function getParam(name){
  const url=new URL(window.location.href);
  return decodeURIComponent(url.searchParams.get(name)||'');
}

const folio = getParam('folio');
const cliente = getParam('cliente');
const ruta = getParam('ruta');
const sucursal = getParam('sucursal');
const fechaVenta = getParam('fechaVenta');
const importeVenta = getParam('importeVenta');
const localidad = getParam('localidad');

let abonos=[];
try{
  const raw=getParam('abonos');
  if(raw) abonos=JSON.parse(raw);
}catch(e){}

/* ========= CÁLCULOS ========= */
const importeVentaNum=parseNum(importeVenta);
const totalAbonado=abonos.reduce((s,r)=>s+parseNum(r.abono),0);
const saldoActual=importeVentaNum-totalAbonado;

/* ========= RENDER ========= */
document.getElementById('app').innerHTML=`
<div class="header">
  <div>
    <div class="brand">Estado de Cuenta</div>
    <div class="brand-name">MUEBLERÍA ADRIANA</div>
    <div class="folio-title">${folio}</div>
    <div class="cliente-name">${cliente} · ${localidad}</div>
  </div>
  <div class="header-right">
    <div class="fecha-label">Fecha de Venta</div>
    <div class="fecha-val">${fechaVenta}</div>
    <div class="ruta-badge">${ruta} / ${sucursal}</div>
  </div>
</div>

<div class="summary-grid">
  <div class="summary-card">
    <div class="summary-label">Importe Venta</div>
    <div class="summary-value venta">${fmt(importeVenta)}</div>
  </div>
  <div class="summary-card">
    <div class="summary-label">Total Abonado</div>
    <div class="summary-value abonado">${fmt(totalAbonado)}</div>
  </div>
  <div class="summary-card">
    <div class="summary-label">Saldo Actual</div>
    <div class="summary-value saldo">${fmt(saldoActual)}</div>
  </div>
</div>

<div class="section-header">
  <div>Registros de Cobranza</div>
  <div>${abonos.length} pagos</div>
</div>

<div class="table-wrap">
<table>
<thead>
<tr>
<th>Fecha</th>
<th>Tipo</th>
<th>Adeudo</th>
<th>Abono</th>
<th>Saldo</th>
</tr>
</thead>
<tbody>
${abonos.map(r=>`
<tr>
<td>${r.fecha}</td>
<td><span class="tipo-badge tipo-cobranza">${r.tipoAbono||'Cobranza'}</span></td>
<td class="td-adeudo">${fmt(r.adeudo)}</td>
<td class="td-abono">+${fmt(r.abono)}</td>
<td class="td-saldo"><span class="saldo-pill">${fmt(r.saldo)}</span></td>
</tr>
`).join('')}
</tbody>
</table>
</div>

<div class="footer">
  <div>Generado automáticamente</div>
  <div>
    <div>Saldo Pendiente</div>
    <div class="saldo-final-val">${fmt(saldoActual)}</div>
  </div>
</div>
`;
</script>
</body>
</html>
